<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <style>
      .base { fill:#fef9c3; stroke:#ca8a04; stroke-width:1.6; }
      .ent  { fill:#ffffff; stroke:#334155; stroke-width:1.6; }
      .ref  { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.6; }
      .join { fill:#ecfdf5; stroke:#10b981; stroke-width:1.4; }
      .t    { fill:#0f172a; font-size:14px; font-weight:700; }
      .tr   { fill:#334155; font-size:13px; font-weight:700; }
      .sub  { fill:#64748b; font-size:10px; }
      .edge { stroke:#475569; stroke-width:1.6; fill:none; }
      .edgeP{ stroke:#9333ea; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
      .edgeJ{ stroke:#10b981; stroke-width:1.4; fill:none; }
      .card { fill:#475569; font-size:10px; font-weight:700; }
      .lbl  { fill:#334155; font-size:10px; }
      .hdr  { fill:#0f172a; font-size:17px; font-weight:700; }
      .note { fill:#64748b; font-size:10px; }
      .badge{ fill:#7e22ce; font-size:10px; font-weight:700; }
    </style>
  </defs>

  <text x="30" y="32" class="hdr">HHH Intake — Target Data Model (after Lisa review, 12 Jun)</text>

  <!-- ===== Patient Unit (stable base) ===== -->
  <rect class="base" x="40" y="70" width="190" height="78" rx="9"/>
  <text x="135" y="96" text-anchor="middle" class="t">Patient Unit</text>
  <text x="135" y="113" text-anchor="middle" class="sub">STABLE base layer</text>
  <text x="135" y="127" text-anchor="middle" class="sub">name, DOB, address, insurance,</text>
  <text x="135" y="139" text-anchor="middle" class="sub">family, blood group (reusable)</text>

  <!-- ===== Patient (changing record) ===== -->
  <rect class="ent" x="40" y="230" width="190" height="70" rx="9"/>
  <text x="135" y="256" text-anchor="middle" class="t">Patient</text>
  <text x="135" y="273" text-anchor="middle" class="sub">CHANGING record layer</text>
  <text x="135" y="287" text-anchor="middle" class="sub">admissions, episodes, links</text>

  <!-- Unit 1 -> * Patient -->
  <path class="edge" d="M135,148 L135,230" marker-end="url(#arr)"/>
  <text x="144" y="172" class="card">1</text>
  <text x="144" y="222" class="card">*</text>
  <text x="144" y="198" class="lbl">unit_id</text>

  <!-- ===== Patient <-> PG (many-to-many) ===== -->
  <rect class="ref" x="430" y="70" width="180" height="56" rx="9"/>
  <text x="520" y="94" text-anchor="middle" class="tr">Physician Group</text>
  <text x="520" y="110" text-anchor="middle" class="sub">(a.k.a. Practice)</text>

  <rect class="join" x="240" y="86" width="150" height="40" rx="9"/>
  <text x="315" y="104" text-anchor="middle" class="sub" font-weight="700" fill="#047857">patient_physician_groups</text>
  <text x="315" y="118" text-anchor="middle" class="sub" fill="#047857">link (0..* both sides)</text>

  <!-- Patient - join - PG -->
  <path class="edge" d="M135,230 C135,150 180,106 240,106" marker-end="url(#arr)"/>
  <path class="edgeJ" d="M390,106 L430,98" marker-end="url(#arr)"/>
  <text x="150" y="150" class="card">0..*</text>
  <text x="398" y="92" class="card">0..*</text>

  <!-- ===== Patient <-> Practitioner (0..many direct) ===== -->
  <rect class="ref" x="430" y="160" width="180" height="56" rx="9"/>
  <text x="520" y="184" text-anchor="middle" class="tr">Practitioner</text>
  <text x="520" y="200" text-anchor="middle" class="sub">Physician (by NPI)</text>

  <rect class="join" x="240" y="170" width="150" height="40" rx="9"/>
  <text x="315" y="188" text-anchor="middle" class="sub" font-weight="700" fill="#047857">patient_practitioners</text>
  <text x="315" y="202" text-anchor="middle" class="sub" fill="#047857">link (0..many)</text>

  <path class="edge" d="M165,230 C200,224 210,192 240,190" marker-end="url(#arr)"/>
  <path class="edgeJ" d="M390,190 L430,188" marker-end="url(#arr)"/>
  <text x="206" y="216" class="card">0..*</text>
  <text x="398" y="182" class="card">0..*</text>

  <text x="640" y="100" class="note">Doctor/PG link is DIRECT on the patient —</text>
  <text x="640" y="114" class="note">NOT through admission.</text>

  <!-- ===== Admission ===== -->
  <rect class="ent" x="40" y="380" width="190" height="78" rx="9"/>
  <text x="135" y="406" text-anchor="middle" class="t">Admission</text>
  <text x="135" y="423" text-anchor="middle" class="sub">starts at SOC (Start of Care)</text>
  <text x="135" y="436" text-anchor="middle" class="sub">EOC = last episode's EOE</text>
  <text x="135" y="449" text-anchor="middle" class="sub">admitting provider: PG / Practitioner / HHAH</text>

  <!-- Patient 1 -> * Admission -->
  <path class="edge" d="M135,300 L135,380" marker-end="url(#arr)"/>
  <text x="144" y="324" class="card">1</text>
  <text x="144" y="372" class="card">*</text>
  <text x="144" y="348" class="lbl">patient_id</text>

  <!-- Admission -> HHAH (admitting agency) -->
  <rect class="ref" x="430" y="400" width="180" height="50" rx="9"/>
  <text x="520" y="422" text-anchor="middle" class="tr">HHAH</text>
  <text x="520" y="438" text-anchor="middle" class="sub">home health agency</text>
  <path class="edge" d="M230,420 L430,423" marker-end="url(#arr)"/>
  <text x="250" y="414" class="card">*</text>
  <text x="412" y="416" class="card">1</text>
  <text x="270" y="438" class="lbl">agency_id (admitting)</text>

  <!-- ===== Episode ===== -->
  <rect class="ent" x="40" y="540" width="190" height="86" rx="9"/>
  <text x="135" y="566" text-anchor="middle" class="t">Episode</text>
  <text x="135" y="583" text-anchor="middle" class="sub">SOE → EOE (~60–90 days)</text>
  <text x="135" y="596" text-anchor="middle" class="sub">multiple per admission</text>
  <text x="135" y="612" text-anchor="middle" class="badge">status: eligible / billable (computed)</text>

  <!-- Admission 1 -> * Episode -->
  <path class="edge" d="M135,458 L135,540" marker-end="url(#arr)"/>
  <text x="144" y="482" class="card">1</text>
  <text x="144" y="532" class="card">*</text>
  <text x="144" y="508" class="lbl">admission_id</text>

  <!-- ===== Order ===== -->
  <rect class="ent" x="430" y="560" width="220" height="92" rx="9" stroke="#9333ea"/>
  <text x="540" y="586" text-anchor="middle" class="t" fill="#7e22ce">Order</text>
  <text x="540" y="603" text-anchor="middle" class="sub">carries its own SOC / SOE / EOE</text>
  <text x="540" y="616" text-anchor="middle" class="sub">document type: 485 / F2F / etc.</text>
  <text x="540" y="632" text-anchor="middle" class="sub">signed? → drives billable</text>
  <text x="540" y="645" text-anchor="middle" class="sub">F2F order_date → 6-mo eligible window</text>

  <!-- Order -> Episode (match by SOE/EOE, reuse or create) -->
  <path class="edgeP" d="M430,600 C320,610 260,595 230,588" marker-end="url(#arrP)"/>
  <text x="250" y="612" class="card" fill="#9333ea">*</text>
  <text x="412" y="594" class="card" fill="#9333ea">1</text>
  <text x="250" y="640" class="lbl" fill="#7e22ce">matched by SOE/EOE — reuse if exists, else create</text>

  <!-- Order -> PG / Practitioner / HHAH (purple dashed) -->
  <path class="edgeP" d="M540,560 C560,300 560,200 610,195" marker-end="url(#arrP)"/>
  <path class="edgeP" d="M560,560 C600,460 610,455 610,450" marker-end="url(#arrP)"/>
  <text x="660" y="560" class="badge">Order also references:</text>
  <text x="660" y="575" class="note">Patient, Admission, Episode,</text>
  <text x="660" y="588" class="note">PG, HHAH, Practitioner</text>
  <text x="660" y="601" class="note">(billing + supervising)</text>

  <!-- ===== Lifecycle states box ===== -->
  <rect x="700" y="220" width="380" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="720" y="246" class="tr">Lifecycle status (shown per object)</text>
  <text x="720" y="268" class="note">Patient · Physician Group · Practitioner · HHAH ·</text>
  <text x="720" y="282" class="note">Admission · Episode · Order</text>
  <text x="720" y="306" class="lbl">each shows: Found · Missing · Created · Updated · In-review</text>
  <text x="720" y="326" class="badge">Episode also: Eligible / Billable</text>
  <text x="720" y="348" class="note">Eligible = has 485 + active F2F (within 6 mo)</text>
  <text x="720" y="362" class="note">Billable = all orders incl. 485 are signed</text>

  <!-- ===== Rules / legend ===== -->
  <rect x="40" y="680" width="1040" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="704" class="tr">Key rules &amp; legend</text>

  <line x1="60" y1="722" x2="100" y2="722" class="edge" marker-end="url(#arr)"/>
  <text x="108" y="726" class="lbl">direct FK (parent → child / many → one)</text>
  <line x1="320" y1="722" x2="360" y2="722" class="edgeJ" marker-end="url(#arr)"/>
  <text x="368" y="726" class="lbl">many-to-many link table</text>
  <line x1="560" y1="722" x2="600" y2="722" class="edgeP" marker-end="url(#arrP)"/>
  <text x="608" y="726" class="lbl">Order references (purple dashed)</text>
  <rect x="820" y="715" width="14" height="14" class="base"/>
  <text x="840" y="726" class="lbl">stable base layer (Patient Unit)</text>

  <text x="60" y="752" class="note">• No Physician Group → patient is NOT created; whole row goes to human review.</text>
  <text x="60" y="768" class="note">• Patient ↔ PG and Patient ↔ Practitioner are 0..* both sides, independent of admission.</text>
  <text x="60" y="784" class="note">• Admission = one Start of Care holding many Episodes (~60–90 days); Order picks its episode by its own SOE/EOE. Episode status is computed, never stored.</text>
</svg>
